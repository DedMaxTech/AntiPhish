[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antiphish-local"
version = "2.1.0"
description = "Local precision-first phishing analysis pipeline for EML, HTML, URLs and attachments"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "idna>=3.7,<4",
  "lxml>=5.3,<7",
  "Pillow>=10.4,<13",
  "PyMuPDF>=1.25,<2",
  "pypdf>=5.1,<7",
  "opencv-python>=4.10,<5",
  "tldextract>=5.1,<6",
  "playwright>=1.50,<2",
  "psutil>=6,<8",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1"]
active = ["oletools>=0.60.2,<1"]
ocr = ["rapidocr>=3.8,<4", "onnxruntime>=1.20,<2"]
deep = [
  "accelerate>=1.2,<2",
  "safetensors>=0.5,<1",
  "torch>=2.6,<3",
  "transformers>=5.5,<6",
]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "httpx>=0.28,<1"]

[project.scripts]
antiphish = "antiphish.cli:main"
antiphish-api = "antiphish.api:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
